<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Our Puzzle Game</title>
    <link rel="stylesheet" href="puzzle.css?v=4">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>🧩 Our Puzzle Game</h1>
            <div class="game-controls">
                <button id="shuffleBtn" class="control-btn">🔀 Shuffle</button>
                <button id="toggleReferenceBtn" class="control-btn">👁️ Show Reference</button>
                <div class="timer">Time: <span id="timer">00:00</span></div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="reference-image" id="referenceImageContainer" style="display: none;">
                <img src="us.jpg" alt="Reference image" id="referenceImg">
                <div class="image-overlay">Reference Image</div>
                <div class="valentine-message">💕 Happy Valentine's Shaily! 💕</div>
            </div>
            
            <div class="puzzle-container">
                <div class="puzzle-board" id="puzzleBoard"></div>
                <div class="pieces-container" id="piecesContainer">
                    <h3>Puzzle Pieces</h3>
                    <div class="pieces-area" id="piecesArea"></div>
                </div>
            </div>
        </div>
        
        <div class="success-modal" id="successModal" style="display: none;">
            <div class="modal-content">
                <h2>🎉 Puzzle Completed!</h2>
                <button id="doneBtn" class="control-btn">Done</button>
            </div>
        </div>
    </div>
    
    <script src="puzzle.js?v=4"></script>
</body>
</html>
